spring.application.name=prueba2
server.port=8081

# Base de datos H2 guardada en un archivo dentro del proyecto (carpeta data/)
spring.datasource.url=jdbc:h2:file:./data/pruebaspring;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver la base de datos: http://localhost:8081/h2-console
spring.h2.console.enabled=true

# Flyway ejecuta al arrancar los scripts de src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration
